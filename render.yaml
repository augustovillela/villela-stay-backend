services:
  - type: web
    name: villela-stay-backend
    runtime: node
    plan: starter   # plano pago: necessario para disco persistente
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    # Disco persistente: guarda usuarios do Portal Staff, relatorios publicados,
    # leads, eventos e analytics — sobrevive a cada deploy.
    disk:
      name: villela-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STAYS_CLIENT_ID
        sync: false
      - key: STAYS_SECRET
        sync: false
      # Portal Staff (definir valores no painel do Render — repositorio publico, nada de segredo aqui):
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET           # segredo de assinatura das sessoes
        sync: false
      - key: ADMIN_EMAIL          # admin inicial (augusto.villela@gmail.com)
        sync: false
      - key: ADMIN_INITIAL_PASSWORD  # senha inicial do admin (trocar no 1o acesso)
        sync: false
      - key: PUBLISH_KEY          # chave usada pelos agentes para publicar entregas
        sync: false
      # Villela Legal Intelligence (opcional):
      # - ANTHROPIC_API_KEY -> IA juridica em modo DIRETO (sem ela: fila p/ agente local)
      # - LEGAL_LLM_MODELS, LEGAL_ROTINAS(=off), LEGAL_ROTINA_HORA, LEGAL_OAB(+_UF): ver backend/legal/README.md
      - key: ANTHROPIC_API_KEY
        sync: false
      # Villela Growth OS: cofre de credenciais das integracoes (AES-256-GCM).
      # 32 bytes em hex ou base64. SEM ela o cofre recusa gravar segredo.
      # Gerar: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: GROWTH_SECRET_KEY
        sync: false
      # VILLELA FINANCE (14o produto). Banco SQLite proprio em
      # DATA_DIR/financeiro/ — nasce sozinho no primeiro boot, nao precisa
      # de env para funcionar. As de baixo sao OPCIONAIS e cada uma liga uma
      # capacidade; sem elas o modulo sobe e DIZ no log o que esta faltando.
      #
      # Replica do razao no R2 (ADR-0004): sem estas quatro, o diario grava
      # so no disco e o RPO real e o do snapshot diario (~24h), nao 5 min.
      # Pode reusar o mesmo bucket/credencial da Origena mudando o prefixo.
      - key: FINANCE_S3_ENDPOINT    # https://<accountid>.r2.cloudflarestorage.com
        sync: false
      - key: FINANCE_S3_BUCKET
        sync: false
      - key: FINANCE_S3_KEY
        sync: false
      - key: FINANCE_S3_SECRET
        sync: false
      - key: FINANCE_S3_REGION
        value: auto
      - key: FINANCE_S3_PREFIXO
        value: financeiro/diario/
      # Intervalo da replica, em minutos.
      - key: FINANCE_REPLICA_MIN
        value: "5"
      # Sincronizacao automatica da Stays, em minutos. DESLIGADA (ausente ou
      # 0): o adaptador so roda por chamada de rota. Ligar so DEPOIS de rodar
      # a previa (dryRun) e conferir o que ele pretende lancar.
      # - key: FINANCE_STAYS_SYNC_MIN
      #   value: "60"

      # ORIGENA (12o produto). Unico com banco PROPRIO (PostgreSQL) e todo
      # binario no R2 — os porquês estao em docs/origena/DECISIONS/ (repo-pai).
      # Sem estas envs a landing sobe e o resto fica desligado, com log claro.
      - key: ORIGENA_DATABASE_URL   # URL INTERNA do origena-db (mesma regiao)
        sync: false
      - key: ORIGENA_S3_ENDPOINT    # https://<accountid>.r2.cloudflarestorage.com
        sync: false
      - key: ORIGENA_S3_BUCKET
        value: villela-origena
      - key: ORIGENA_S3_KEY
        sync: false
      - key: ORIGENA_S3_SECRET
        sync: false
      - key: ORIGENA_S3_REGION
        value: auto

  # ---------------------------------------------------------------------
  # Worker da Origena (ADR-0005): processa midia e IA FORA do processo web.
  # O web tem 2 GB para 12 produtos; transcodificar video la derruba o
  # grupo inteiro. Nao e caminho critico de leitura: se cair, a familia
  # continua navegando o acervo e so o processamento novo fica em espera.
  # NAO recebe segredo de pagamento — so banco, R2 e provedores de IA.
  # ---------------------------------------------------------------------
  - type: worker
    name: origena-worker
    runtime: node
    plan: starter
    # REGIAO OBRIGATORIA e igual a do banco: a rede interna do Render NAO
    # cruza regiao. Criado em oregon com o banco em virginia, o worker sobe
    # "live" e morre em loop com ENOTFOUND no host interno do Postgres.
    # (Pela API o campo vai dentro de serviceDetails; no topo ele e ignorado
    #  em silencio e o servico cai no padrao oregon.)
    region: virginia
    buildCommand: npm install
    startCommand: node origena/worker.js
    envVars:
      - key: ORIGENA_DATABASE_URL
        sync: false
      - key: ORIGENA_S3_ENDPOINT
        sync: false
      - key: ORIGENA_S3_BUCKET
        value: villela-origena
      - key: ORIGENA_S3_KEY
        sync: false
      - key: ORIGENA_S3_SECRET
        sync: false
      - key: ORIGENA_S3_REGION
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
