<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Staff — Villela Stay</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/grupo-villela/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/grupo-villela/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/brand/grupo-villela/apple-touch-icon.png">
  <link rel="manifest" href="/staff/manifest.webmanifest">
  <meta name="theme-color" content="#1B2A4A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap">
  <!-- PWA standalone (iOS + Android): app instalado abre em tela cheia, sem a barra do navegador.
       Sem 'apple-mobile-web-app-capable' o iPhone NÃO roda como app (abre no Safari). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Villela Staff">
  <link rel="stylesheet" href="/staff/styles.css">
  <!-- Design system do portal (todas as verticais). Escopo na classe .vx, aplicada
       ao #conteudo por navegar(); o atributo data-vertical troca só a cor de acento.
       styles.css continua valendo fora do escopo — nada quebra. -->
  <link rel="stylesheet" href="/assets/brand/villela-ui.css?v=4">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <main id="tela-login" class="login hidden">
    <form id="form-login" class="login-card" autocomplete="on" method="POST" action="/staff/api/login">
      <div class="marca"><img src="/assets/brand/grupo-villela/simbolo-v.svg" alt="Grupo Villela Stay" style="height:30px;vertical-align:middle"> Grupo Villela Stay</div>
      <p class="login-sub">Portal Staff — acesso restrito</p>
      <label>E-mail
        <input type="email" id="login-email" name="email" required autocomplete="username" autocapitalize="off" spellcheck="false">
      </label>
      <label>Senha
        <input type="password" id="login-senha" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn">Entrar</button>
      <p id="login-erro" class="erro"></p>
      <a class="login-voltar" href="https://villelastay.com.br" target="_blank" rel="noopener">← Voltar ao site público</a>
      <p class="login-rodape" style="text-align:center;font-size:.75rem;color:#6b7075;margin:8px 0 0">Uma empresa do Grupo Villela Stay · CNPJ 56.776.526/0001-12</p>
    </form>
  </main>

  <!-- ===================== TROCAR SENHA (1º acesso) ===================== -->
  <main id="tela-trocar" class="login hidden">
    <form id="form-trocar" class="login-card">
      <div class="marca"><img src="/assets/brand/grupo-villela/simbolo-v.svg" alt="Grupo Villela Stay" style="height:30px;vertical-align:middle"> Grupo Villela Stay</div>
      <p class="login-sub">Defina uma nova senha para continuar</p>
      <label>Senha atual
        <input type="password" id="tr-atual" required autocomplete="current-password">
      </label>
      <label>Nova senha (mín. 8 caracteres)
        <input type="password" id="tr-nova" required minlength="8" autocomplete="new-password">
      </label>
      <label>Confirme a nova senha
        <input type="password" id="tr-conf" required minlength="8" autocomplete="new-password">
      </label>
      <button type="submit" class="btn">Salvar nova senha</button>
      <p id="tr-erro" class="erro"></p>
    </form>
  </main>

  <!-- ===================== APP ===================== -->
  <div id="app" class="hidden">
    <header class="topo">
      <button id="btn-menu" class="btn-menu" aria-label="Abrir menu">☰</button>
      <div class="marca"><img src="/assets/brand/grupo-villela/logo-negativo.svg" alt="Grupo Villela Stay" style="height:30px;vertical-align:middle"> Grupo Villela Stay <span class="tag">Staff</span></div>
      <div class="topo-dir">
        <button id="btn-inicio" class="btn-inicio" title="Voltar ao início do app" aria-label="Início do app">🏠 <span class="rot-inicio">Início</span></button>
        <a class="link-site" href="https://villelastay.com.br" target="_blank" rel="noopener" title="Abrir o site público (nova aba)">🌐 Site público</a>
        <span id="quem"></span>
        <button id="btn-sair" class="link-sair">Sair</button>
      </div>
    </header>
    <div class="corpo">
      <nav id="menu" class="menu"></nav>
      <main id="conteudo" class="conteudo"></main>
    </div>
  </div>

  <!-- SPA modularizada em scripts clássicos (compartilham o escopo global). Ordem importa:
       app-core primeiro (helpers/shell) e app-boot por último (chama init()). -->
  <script src="/staff/app-core.js"></script>
  <script src="/staff/app-manuais.js"></script>
  <script src="/staff/app-listas.js"></script>
  <script src="/staff/app-calendario.js"></script>
  <script src="/staff/app-operacao.js"></script>
  <script src="/staff/app-atendimento.js"></script>
  <script src="/staff/app-gestao.js"></script>
  <script src="/staff/app-recursos.js"></script>
  <script src="/staff/app-juridico-fiscal.js"></script>
  <script src="/staff/app-estrategia.js"></script>
  <script src="/staff/app-hospede.js"></script>
  <script src="/staff/app-crm.js"></script>
  <script src="/staff/app-livraria.js"></script>
  <script src="/staff/legal-ui.js"></script>
  <script src="/staff/app-legal.js"></script>
  <!-- ONDA LIVRO: abas de paridade com o livro "Claude AI na Prática Jurídica" (estende LG) -->
  <script src="/staff/app-legal-livro.js"></script>
  <!-- REDESIGN do módulo jurídico: navegação agrupada + painel como central de
       comando. Sobrescreve LG.render/pintar/vPainel; remover volta ao anterior. -->
  <script src="/staff/app-legal-shell.js"></script>
  <script src="/staff/app-legal-saas.js"></script>
  <script src="/staff/app-vdocs.js"></script>
  <script src="/staff/app-vpe.js"></script>
  <script src="/staff/app-vsm.js"></script>
  <script src="/staff/app-vcrm.js"></script>
  <script src="/staff/app-academy.js"></script>
  <script src="/staff/app-cortesia.js"></script>
  <script src="/staff/app-boot.js"></script>
  <script>
    // PWA: registra o service worker (sem cache — só para o portal ser instalável como app)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/staff/sw.js').catch(() => {});
  </script>
</body>
</html>
